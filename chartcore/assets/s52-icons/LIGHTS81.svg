<svg data-source="official-plib" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 7.585 5.135" width="7.585" height="5.135"><!-- SCALED x0.5 (mivnav change qqqxqskl, 2026-07-29). The generator emitted chartsymbols.xml HPGL at ~1/25 unit, which is ~1.27x the presentation library's OWN bitmap px for the same symbol and ~2x the vendored quantenschaum set the rest of the chart is drawn from, so every one of these rendered about twice the size of the artwork beside it (DANGER01 32x25 next to the drawn DANGER51 16x10 — same dotted danger ellipse). The factor is applied to the CONTENT with the viewBox narrowed to match; editing width/height alone changes NOTHING chartcore serves (see ../no-anchor.svg). --><!-- RECOLOURED onto ROLE hexes (mivnav change xytoltso, 2026-07-29). The trace originally baked the day palette's own S-52 tokens, which `icons::roles::ASSET_HEXES` has no entry for, so the symbol stayed day-coloured under every theme. Geometry is untouched; only paint values moved, each onto the hex the vendored artwork beside it already uses for the same job. See the commit for the token-by-token mapping. --><g transform="scale(0.5) translate(0,0.36)"><line x1="0" y1="9.84" x2="2.92" y2="0" stroke="#ec008c" stroke-opacity="1" stroke-width="1" stroke-linecap="round"/><line x1="2.92" y1="0" x2="5.85" y2="9.88" stroke="#ec008c" stroke-opacity="1" stroke-width="1" stroke-linecap="round"/><line x1="5.85" y1="9.88" x2="8.85" y2="0" stroke="#ec008c" stroke-opacity="1" stroke-width="1" stroke-linecap="round"/><line x1="8.85" y1="0" x2="11.81" y2="9.92" stroke="#ec008c" stroke-opacity="1" stroke-width="1" stroke-linecap="round"/><line x1="11.81" y1="9.92" x2="14.78" y2="0" stroke="#ec008c" stroke-opacity="1" stroke-width="1" stroke-linecap="round"/></g></svg>