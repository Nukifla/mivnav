<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- mivnav app icon: a compass rose / north arrow on the app accent blue.
       Accent is color-accent #0284c7 from the index.css DAY palette. -->
  <rect width="512" height="512" rx="96" fill="#0284c7"/>
  <g transform="translate(256 256)">
    <!-- outer ring -->
    <circle r="150" fill="none" stroke="#ffffff" stroke-width="14" opacity="0.85"/>
    <!-- four-point compass star -->
    <path d="M0 -172 L34 -34 L172 0 L34 34 L0 172 L-34 34 L-172 0 L-34 -34 Z"
          fill="#ffffff" opacity="0.28"/>
    <!-- north needle (solid), south needle (outline) -->
    <path d="M0 -172 L40 0 L0 -12 Z" fill="#ffffff"/>
    <path d="M0 -172 L-40 0 L0 -12 Z" fill="#e0f2fe"/>
    <path d="M0 172 L40 0 L0 12 Z" fill="#7dd3fc"/>
    <path d="M0 172 L-40 0 L0 12 Z" fill="#38bdf8"/>
    <circle r="14" fill="#ffffff"/>
  </g>
</svg>
